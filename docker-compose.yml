services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: chargebook-db
    environment:
      POSTGRES_DB: chargebook
      POSTGRES_USER: chargebook
      POSTGRES_PASSWORD: chargebook
    ports:
      - "5432:5432"
    volumes:
      - chargebook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargebook -d chargebook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chargebook-pgdata:
