ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ io.github.inegru.chargebook.backend.ApplicationKt.module ]
    }
}

chargebook {
    volvo {
        clientId = ${?VOLVO_CLIENT_ID}
        clientSecret = ${?VOLVO_CLIENT_SECRET}
        vccApiKey = ${?VOLVO_VCC_API_KEY}
        redirectUri = "http://localhost:8080/auth/callback"
        redirectUri = ${?VOLVO_REDIRECT_URI}
        authorizeUrl = "https://volvoid.eu.volvocars.com/as/authorization.oauth2"
        tokenUrl = "https://volvoid.eu.volvocars.com/as/token.oauth2"
        apiBaseUrl = "https://api.volvocars.com"
    }

    database {
        url = "jdbc:postgresql://localhost:5432/chargebook"
        url = ${?DATABASE_URL}
        user = "chargebook"
        user = ${?DATABASE_USER}
        password = "chargebook"
        password = ${?DATABASE_PASSWORD}
    }
}
